name: Release to NuGet

# Publishing a GitHub release builds, tests and packs all 11 packages, then pushes them to nuget.org.
# The push uses NuGet trusted publishing: nuget.org trades this job's GitHub OIDC token for an API key
# that lasts an hour, so the repo stores no NuGet key. The nuget.org policy names this repo and this file,
# release.yml, and the repo variable NUGET_USER holds the nuget.org username that owns the packages.
# Running the workflow by hand does everything but the push, and keeps the packages as a run artifact.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
            11.x
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore
      - name: Pack
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build --no-restore --output packages
          done
      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/
      - name: NuGet login
        if: github.event_name == 'release'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet
        if: github.event_name == 'release'
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
